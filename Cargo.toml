[package]
name = "declutter"
version = "0.1.0"
edition = "2021"
description = "Read-only terminal treemap for exploring disk usage"
license = "MIT"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "tests/**", "Makefile", "scripts/install.sh", ".declutter.toml"]

[profile.release]
strip = "debuginfo"

[dependencies]
unicode-width = "0.1"
unicode-segmentation = "1"
ratatui = "0.28"
crossterm = "0.28"
jwalk = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
glob = "0.3"
